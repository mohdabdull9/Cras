<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b3558">
<title>CTLRS • Comoros Tourism Licensing & Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{--navy:#0b3558;--navy2:#08263f;--blue:#1774d1;--cyan:#159aa8;--green:#15935a;--gold:#d3a62a;--red:#d94b52;--ink:#15283a;--muted:#687d90;--bg:#f3f7fb;--card:#fff;--line:#dce6ef;--shadow:0 12px 35px rgba(15,55,85,.09);--r:16px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "DM Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}
.topbar{height:68px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:18px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;color:var(--navy);text-decoration:none}.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--navy),var(--cyan));display:grid;place-items:center;color:#fff;font:800 16px Manrope}.brand small{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:600}
.nav{display:flex;gap:4px;margin-left:auto}.nav button{border:0;background:transparent;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:600}.nav button:hover{background:#edf4fa;color:var(--navy)}
.lang{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;transition:.18s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--navy);color:#fff}.success{background:var(--green);color:#fff}.outline{background:#fff;color:var(--navy);border:1px solid var(--line)}.danger{background:var(--red);color:#fff}
.hero{min-height:600px;background:radial-gradient(circle at 80% 20%,#168aa0 0,#0b4268 38%,#071f34 100%);color:#fff;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:520px;height:520px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-160px;top:-150px;box-shadow:0 0 0 70px rgba(255,255,255,.025),0 0 0 140px rgba(255,255,255,.02)}
.hero-inner{max-width:1180px;margin:auto;padding:85px 28px;position:relative;z-index:2;display:grid;grid-template-columns:1.15fr .85fr;gap:55px;align-items:center}.eyebrow{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:7px 11px;border-radius:999px;font-size:12px}.dot{width:8px;height:8px;background:#48d38b;border-radius:50%}.hero h1{font:800 clamp(38px,5vw,64px)/1.02 Manrope;margin:20px 0 18px;letter-spacing:-.04em}.hero p{font-size:17px;color:#d6e7f4;max-width:680px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.hero .outline{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.hero-card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:24px;backdrop-filter:blur(15px);box-shadow:0 25px 70px rgba(0,0,0,.18)}.hero-card h3{font:700 20px Manrope;margin:0 0 15px}.flow{display:grid;gap:10px}.flow div{display:flex;gap:12px;align-items:center;padding:12px;background:rgba(255,255,255,.07);border-radius:12px}.flow b{width:28px;height:28px;border-radius:9px;background:#fff;color:var(--navy);display:grid;place-items:center}.section{max-width:1180px;margin:auto;padding:60px 28px}.section h2{font:800 30px Manrope;margin:0 0 8px}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.feature,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.feature{padding:22px}.feature .ico{font-size:25px}.feature h3{margin:12px 0 5px}
footer{background:var(--navy2);color:#c8d9e7;padding:25px 28px}.footer-in{max-width:1180px;margin:auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.auth{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:35px}.auth-card{width:min(520px,100%);padding:30px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.auth-card h1{font:800 28px Manrope}.field{margin:13px 0}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #cbd9e5;border-radius:10px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1774d11c}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.app-shell{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 68px)}.sidebar{background:var(--navy2);color:#cfe0ec;padding:20px 13px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}.side-brand{padding:8px 10px 20px;color:#fff;font-weight:800}.side-brand span{display:block;font-size:11px;color:#8fa9bb;font-weight:500;margin-top:2px}.side-btn{width:100%;text-align:left;background:transparent;border:0;color:#bfd2e1;padding:11px 12px;border-radius:10px;margin:2px 0;font-weight:600}.side-btn:hover,.side-btn.active{background:#1774d1;color:#fff}.main{min-width:0}.dashbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 25px;position:sticky;top:68px;z-index:20}.dashbar h2{margin:0;font:800 20px Manrope}.dashbar .spacer{margin-left:auto}.avatar{width:36px;height:36px;border-radius:50%;background:#e6f1fb;color:var(--navy);display:grid;place-items:center;font-weight:800}.main-content{max-width:1250px;padding:28px;margin:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{padding:18px}.kpi .label{color:var(--muted);font-size:12px}.kpi strong{display:block;font:800 30px Manrope;margin-top:5px}.kpi .trend{font-size:11px;color:var(--green)}
.panel{padding:20px;margin-top:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:15px}.panel h3{font:700 17px Manrope;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}td{font-size:13px}.badge{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;background:#eaf2fb;color:var(--blue)}.badge.green{background:#e5f6ed;color:var(--green)}.badge.orange{background:#fff1dd;color:#ad690b}.badge.red{background:#fde9ea;color:var(--red)}
.actions{display:flex;gap:7px;flex-wrap:wrap}.btn.sm{padding:7px 10px;font-size:12px}.notice{padding:13px 15px;border-radius:11px;background:#eef6ff;border:1px solid #cfe3f7;margin-bottom:15px}.empty{text-align:center;padding:35px;color:var(--muted)}
.modal-back{position:fixed;inset:0;background:rgba(5,20,34,.68);z-index:80;display:grid;place-items:center;padding:20px}.modal{background:#fff;border-radius:18px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:25px}.modal-head{display:flex;justify-content:space-between;gap:15px}.x{border:0;background:#edf3f8;width:34px;height:34px;border-radius:50%}
.public{max-width:1000px;margin:auto;padding:50px 25px}.verify{display:grid;grid-template-columns:1fr .9fr;gap:20px}.license{padding:30px;background:linear-gradient(135deg,#fffef5,#f1f7e9);border:2px solid var(--gold);border-radius:18px;text-align:center}.license h2{font:800 30px Manrope;color:var(--navy)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--navy2);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 12px 30px #0004;z-index:100;max-width:380px}
@media(max-width:950px){.features{grid-template-columns:1fr 1fr}.hero-inner{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.app-shell{grid-template-columns:75px 1fr}.sidebar .side-label,.side-brand span{display:none}.side-brand{text-align:center}.side-btn{text-align:center;font-size:18px}.verify{grid-template-columns:1fr}}
@media(max-width:650px){.topbar{padding:0 14px}.nav{display:none}.hero-inner,.section{padding-left:18px;padding-right:18px}.features,.kpis,.grid2{grid-template-columns:1fr}.app-shell{grid-template-columns:1fr}.sidebar{position:fixed;left:-260px;top:68px;width:245px;z-index:50;transition:.2s}.sidebar.open{left:0}.dashbar{padding:0 14px}.main-content{padding:18px}.hero{min-height:auto}.hero-inner{padding-top:60px;padding-bottom:60px}}
</style>
</head>
<body>
<div id="root"></div><div id="modal"></div><div id="toast"></div>
<script>
const cfg=window.CTLRS_CONFIG||{};
const sb=(cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY)?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
const state={user:null,profile:null,view:'dashboard',lang:'en',applications:[],licenses:[],payments:[],loading:false};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.className='toast';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.className='',3500)};
const roleName=r=>({admin:'Administrator',officer:'Licensing Officer',inspector:'Inspector',director:'Director',finance:'Finance Officer',operator:'Tourism Operator'}[r]||r);
const statusMap={submitted:['Submitted','blue'],verification:['Under verification','blue'],inspection:['Under inspection','orange'],approval:['Awaiting approval','orange'],payment:['Payment required','orange'],approved:['Approved','green'],rejected:['Rejected','red'],cancelled:['Cancelled','red']};
const badge=s=>{let x=statusMap[s]||[s,'blue'];return `<span class="badge ${x[1]=='green'?'green':x[1]=='orange'?'orange':x[1]=='red'?'red':''}">${esc(x[0])}</span>`};
function top(){return `<header class="topbar"><a class="brand" href="#" onclick="home();return false"><span class="mark">C</span><span>CTLRS<small>COMOROS TOURISM LICENSING</small></span></a><nav class="nav"><button onclick="home()">Home</button><button onclick="publicVerify()">Verify License</button><button onclick="showAbout()">About</button></nav><select class="lang" onchange="state.lang=this.value;render()"><option value="en">EN</option><option value="fr">FR</option><option value="ar">AR</option></select>${state.user?`<button class="btn outline" onclick="signOut()">Sign out</button>`:`<button class="btn primary" onclick="loginView()">Sign in</button>`}</header>`}
function home(){state.user=null;state.profile=null;render()}
function landing(){return `${top()}<section class="hero"><div class="hero-inner"><div><span class="eyebrow"><i class="dot"></i> National digital tourism service</span><h1>Register. Verify. Grow tourism.</h1><p>A modern digital platform for tourism business registration, licensing, inspection, payments and public verification across the Comoros.</p><div class="hero-actions"><button class="btn success" onclick="registerView()">Create operator account</button><button class="btn outline" onclick="publicVerify()">Verify an existing license</button></div></div><div class="hero-card"><h3>One connected workflow</h3><div class="flow"><div><b>01</b><span>Business registration & document submission</span></div><div><b>02</b><span>Completeness and regulatory verification</span></div><div><b>03</b><span>Inspection, decision and payment</span></div><div><b>04</b><span>Digital license and public verification</span></div></div></div></div></section>
<section class="section"><div class="section-head"><div><h2>Built for the full licensing journey</h2><p class="muted">A clearer experience for operators, officers, inspectors, finance teams and leadership.</p></div></div><div class="features"><div class="feature"><div class="ico">📝</div><h3>Applications</h3><p class="muted">Structured applications with required documents and status tracking.</p></div><div class="feature"><div class="ico">🔎</div><h3>Verification</h3><p class="muted">Transparent review queues and inspection assignments.</p></div><div class="feature"><div class="ico">💳</div><h3>Payments</h3><p class="muted">Invoice and payment records linked to each application.</p></div><div class="feature"><div class="ico">🪪</div><h3>Digital licensing</h3><p class="muted">Public license verification without exposing private operator data.</p></div></div></section><footer><div class="footer-in"><span>CTLRS • Comoros Tourism Licensing & Registration System</span><span>Secure • Role-based • Supabase-powered</span></div></footer>`}
function loginView(){document.getElementById('root').innerHTML=top()+`<div class="auth"><div class="auth-card"><h1>Welcome back</h1><p class="muted">Sign in to your CTLRS workspace.</p><form onsubmit="signIn(event)"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn primary" style="width:100%">Sign in</button></form><p class="muted" style="text-align:center">New tourism operator? <a href="#" onclick="registerView();return false">Create an account</a></p></div></div>`}
function registerView(){document.getElementById('root').innerHTML=top()+`<div class="auth"><div class="auth-card"><h1>Create operator account</h1><p class="muted">Use a real email address. Supabase Auth will protect your credentials.</p><form onsubmit="signUp(event)"><div class="grid2"><div class="field"><label>Full name</label><input id="name" required></div><div class="field"><label>Phone</label><input id="phone" placeholder="+269 ..."></div></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required></div><button class="btn success" style="width:100%">Create account</button></form><p class="muted"><a href="#" onclick="loginView();return false">Back to sign in</a></p></div></div>`}
async function signIn(e){e.preventDefault();if(!sb)return toast('Add your Supabase URL and anon key in config.js first.');state.loading=true;try{const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)throw error;await loadSession();toast('Signed in successfully.')}catch(x){toast(x.message)}finally{state.loading=false}}
async function signUp(e){e.preventDefault();if(!sb)return toast('Configure Supabase first.');try{const {data,error}=await sb.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:name.value,phone:phone.value}}});if(error)throw error;toast(data.session?'Account created.':'Account created. Check your email to confirm.');if(data.session)await loadSession();}catch(x){toast(x.message)}}
async function signOut(){if(sb)await sb.auth.signOut();state.user=null;state.profile=null;render()}
async function loadSession(){if(!sb)return;const {data}=await sb.auth.getSession();if(!data.session){render();return}state.user=data.session.user;const {data:p,error}=await sb.from('profiles').select('*').eq('id',state.user.id).single();if(error)toast(error.message);state.profile=p;await loadData();render()}
async function loadData(){if(!sb||!state.profile)return;const r=state.profile.role;if(r==='operator'){const {data}=await sb.from('applications').select('*,payments(*),licenses(*)').eq('operator_id',state.user.id).order('created_at',{ascending:false});state.applications=data||[]}else{const {data}=await sb.from('applications').select('*,profiles!applications_operator_id_fkey(full_name,email),payments(*),licenses(*)').order('created_at',{ascending:false});state.applications=data||[]}}
function publicVerify(){document.getElementById('root').innerHTML=top()+`<main class="public"><div class="section-head"><div><h2>Public license verification</h2><p class="muted">Enter a license number to verify its current status.</p></div></div><div class="verify"><div class="card panel"><form onsubmit="verifyLicense(event)"><div class="field"><label>License number</label><input id="licenseNo" placeholder="KM-AG-2026-000001" required></div><button class="btn primary">Verify license</button></form><div id="verifyResult" style="margin-top:18px"></div></div><div class="card panel"><h3>Privacy by design</h3><p class="muted">The public verification page only returns the minimum information required to confirm a license. Private documents, payment records and operator credentials remain protected.</p></div></div></main>`}
async function verifyLicense(e){e.preventDefault();const no=licenseNo.value.trim().toUpperCase();if(!sb)return toast('Configure Supabase first.');const {data,error}=await sb.from('licenses').select('license_no,status,issued_at,expires_at,activity,location,operator_name').eq('license_no',no).maybeSingle();const r=document.getElementById('verifyResult');if(error){r.innerHTML=`<div class="notice">${esc(error.message)}</div>`;return}if(!data){r.innerHTML='<div class="notice">No license was found with that number.</div>';return}r.innerHTML=`<div class="license"><div style="font-size:36px">✓</div><h2>${esc(data.status||'VALID')}</h2><p><b>${esc(data.license_no)}</b></p><p>${esc(data.operator_name||'Licensed tourism operator')}</p><p>${esc(data.activity||'Tourism activity')} • ${esc(data.location||'Comoros')}</p><small>Valid until ${esc(data.expires_at||'—')}</small></div>`}
function showAbout(){toast('CTLRS centralizes registration, verification, inspection, payment and licensing in one secure workflow.')}
function shell(){const p=state.profile||{};const items=[['dashboard','▦','Dashboard'],['applications','▤','Applications'],['payments','◈','Payments'],['licenses','▣','Licenses']];if(['admin','officer','inspector','director','finance'].includes(p.role))items.push(['users','♙','Users']);return `${top()}<div class="app-shell"><aside class="sidebar" id="sidebar"><div class="side-brand">CTLRS<span>${esc(roleName(p.role))}</span></div>${items.map(x=>`<button class="side-btn ${state.view===x[0]?'active':''}" onclick="state.view='${x[0]}';render()">${x[1]} <span class="side-label">${x[2]}</span></button>`).join('')}<button class="side-btn" onclick="signOut()" style="margin-top:25px">⇥ <span class="side-label">Sign out</span></button></aside><div class="main"><div class="dashbar"><button class="btn outline" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><h2>${esc(state.view[0].toUpperCase()+state.view.slice(1))}</h2><div class="spacer"></div><span class="muted">${esc(state.profile?.full_name||state.user?.email||'')}</span><span class="avatar">${esc((state.profile?.full_name||'U').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase())}</span></div><main class="main-content">${viewContent()}</main></div></div>`}
function viewContent(){if(state.view==='applications')return applicationsView();if(state.view==='payments')return paymentsView();if(state.view==='licenses')return licensesView();if(state.view==='users')return usersView();return dashboardView()}
function dashboardView(){const a=state.applications;const counts={total:a.length,active:a.filter(x=>!['approved','rejected','cancelled'].includes(x.status)).length,approved:a.filter(x=>x.status==='approved').length,pending:a.filter(x=>['submitted','verification','inspection','approval','payment'].includes(x.status)).length};return `<div class="kpis"><div class="card kpi"><span class="label">Total applications</span><strong>${counts.total}</strong><span class="trend">Live from Supabase</span></div><div class="card kpi"><span class="label">Pending workflow</span><strong>${counts.pending}</strong><span class="trend">Requires attention</span></div><div class="card kpi"><span class="label">Active cases</span><strong>${counts.active}</strong><span class="trend">In progress</span></div><div class="card kpi"><span class="label">Approved</span><strong>${counts.approved}</strong><span class="trend">Completed</span></div></div><div class="card panel"><div class="panel-head"><div><h3>Recent applications</h3><span class="muted">Your latest licensing activity</span></div><button class="btn outline sm" onclick="state.view='applications';render()">View all</button></div>${appTable(a.slice(0,8))}</div>`}
function appTable(rows){if(!rows.length)return '<div class="empty">No applications found.</div>';return `<div class="table-wrap"><table><thead><tr><th>Reference</th><th>Operator</th><th>Activity</th><th>Status</th><th>Submitted</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.reference_no)}</b></td><td>${esc(x.operator_name||x.profiles?.full_name||'—')}</td><td>${esc(x.activity)}</td><td>${badge(x.status)}</td><td>${esc((x.created_at||'').slice(0,10))}</td><td><button class="btn outline sm" onclick='openApp(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Open</button></td></tr>`).join('')}</tbody></table></div>`}
function applicationsView(){return `<div class="card panel"><div class="panel-head"><div><h3>Applications</h3><span class="muted">Track and manage licensing cases.</span></div>${state.profile.role==='operator'?'<button class="btn success" onclick="newApplication()">+ New application</button>':''}</div>${appTable(state.applications)}</div>`}
function paymentsView(){const rows=state.applications.flatMap(a=>(a.payments||[]).map(p=>({...p,reference_no:a.reference_no})));return `<div class="card panel"><div class="panel-head"><div><h3>Payments</h3><span class="muted">Invoices and payment records linked to applications.</span></div></div>${rows.length?`<div class="table-wrap"><table><tr><th>Reference</th><th>Amount</th><th>Status</th><th>Reference</th><th>Date</th></tr>${rows.map(p=>`<tr><td>${esc(p.reference_no)}</td><td>${esc(p.currency||'KMF')} ${esc(p.amount)}</td><td>${badge(p.status==='paid'?'approved':p.status==='pending'?'payment':'rejected')}</td><td>${esc(p.payment_ref||'—')}</td><td>${esc((p.paid_at||p.created_at||'').slice(0,10))}</td></tr>`).join('')}</table></div>`:'<div class="empty">No payment records yet.</div>'}</div>`}
function licensesView(){const rows=state.applications.filter(a=>(a.licenses||[]).length).flatMap(a=>a.licenses);return `<div class="card panel"><div class="panel-head"><div><h3>Licenses</h3><span class="muted">Issued licenses and public verification numbers.</span></div></div>${rows.length?`<div class="table-wrap"><table><tr><th>License</th><th>Activity</th><th>Status</th><th>Issued</th><th>Expires</th></tr>${rows.map(l=>`<tr><td><b>${esc(l.license_no)}</b></td><td>${esc(l.activity||'—')}</td><td>${badge(l.status==='valid'?'approved':'rejected')}</td><td>${esc(l.issued_at||'—')}</td><td>${esc(l.expires_at||'—')}</td></tr>`).join('')}</table></div>`:'<div class="empty">No licenses issued yet.</div>'}</div>`}
async function usersView(){if(!['admin','officer','director','finance','inspector'].includes(state.profile.role))return '<div class="notice">You do not have permission to view users.</div>';if(!sb)return '';const {data,error}=await sb.from('profiles').select('id,full_name,email,role,active,created_at').order('created_at',{ascending:false});if(error)return `<div class="notice">${esc(error.message)}</div>`;return `<div class="card panel"><div class="panel-head"><div><h3>System users</h3><span class="muted">Role and account status.</span></div></div><div class="table-wrap"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr>${(data||[]).map(u=>`<tr><td>${esc(u.full_name||'—')}</td><td>${esc(u.email||'—')}</td><td><span class="badge">${esc(roleName(u.role))}</span></td><td>${u.active?'<span class="badge green">Active</span>':'<span class="badge red">Disabled</span>'}</td></tr>`).join('')}</table></div></div>`}
function newApplication(){openModal(`<div class="modal-head"><div><h2>New tourism application</h2><p class="muted">Submit the core details first. Officers can request additional documents during verification.</p></div><button class="x" onclick="closeModal()">×</button></div><form onsubmit="createApplication(event)"><div class="grid2"><div class="field"><label>Business / operator name</label><input id="biz" required></div><div class="field"><label>Activity</label><select id="activity" required><option value="">Select...</option><option>Hotel / Accommodation</option><option>Guest House</option><option>Travel Agency</option><option>Tour Operator</option><option>Restaurant</option><option>Diving / Marine Tourism</option></select></div><div class="field"><label>Island</label><select id="island" required><option>Ngazidja</option><option>Ndzouani</option><option>Mwali</option><option>Maore</option></select></div><div class="field"><label>Location</label><input id="location" required></div></div><div class="field"><label>Notes</label><textarea id="notes" rows="4"></textarea></div><button class="btn success">Submit application</button></form>`)}
async function createApplication(e){e.preventDefault();if(!sb)return;const reference='KM-APP-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6);const {error}=await sb.from('applications').insert({reference_no:reference,operator_id:state.user.id,operator_name:biz.value.trim(),activity:activity.value,island:island.value,location:location.value.trim(),notes:notes.value.trim(),status:'submitted'});if(error)toast(error.message);else{closeModal();toast('Application submitted.');await loadData();render()}}
function openApp(a){const staff=['admin','officer','director'].includes(state.profile.role);openModal(`<div class="modal-head"><div><h2>${esc(a.reference_no)}</h2><p class="muted">${esc(a.activity)} • ${esc(a.island||'')}</p></div><button class="x" onclick="closeModal()">×</button></div><div class="grid2"><div><b>Operator</b><p>${esc(a.operator_name||a.profiles?.full_name||'—')}</p></div><div><b>Status</b><p>${badge(a.status)}</p></div><div><b>Location</b><p>${esc(a.location||'—')}</p></div><div><b>Created</b><p>${esc((a.created_at||'').slice(0,19))}</p></div></div><hr><p>${esc(a.notes||'No notes')}</p>${staff?`<div class="field"><label>Update status</label><select id="newStatus"><option>submitted</option><option>verification</option><option>inspection</option><option>approval</option><option>payment</option><option>approved</option><option>rejected</option></select></div><button class="btn primary" onclick="updateStatus('${a.id}')">Save status</button>`:''}`)}
async function updateStatus(id){const s=document.getElementById('newStatus').value;const {error}=await sb.from('applications').update({status:s}).eq('id',id);if(error)toast(error.message);else{closeModal();toast('Application status updated.');await loadData();render()}}
function openModal(html){document.getElementById('modal').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function render(){document.getElementById('root').innerHTML=state.user&&state.profile?shell():landing()}
if(sb){sb.auth.onAuthStateChange((_e,session)=>{if(session&&!state.user)loadSession()});loadSession()}else render();
</script>
</body></html>
