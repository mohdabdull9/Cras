.clk{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}.top .clk{color:var(--mut)}.hr .clk{font-size:13px;opacity:.95}
.av{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}

.shell{transition:grid-template-columns .25s}.shell.sbc{grid-template-columns:68px 1fr}.sbc .lb,.sbc .lo span,.sbc .side .bg{display:none}.sbc .side a{justify-content:center}.sbc .lo{justify-content:center}.mn{min-width:0}

:root{--r-sm:8px;--r-md:12px;--r-lg:18px;--sh-1:0 1px 2px rgba(13,59,102,.06),0 1px 1px rgba(13,59,102,.04);--sh-2:0 4px 14px rgba(13,59,102,.10);--sh-3:0 14px 38px rgba(13,59,102,.16)}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{letter-spacing:-.01em;font-family:'Fraunces',serif;font-weight:700}
.top h2{font-family:'Fraunces',serif}
.card{border-radius:var(--r-md);box-shadow:var(--sh-1);border-color:rgba(13,59,102,.08);transition:box-shadow .25s,transform .25s}
.card:hover{box-shadow:var(--sh-2)}
.pc,.kp,.tl{border-radius:var(--r-md)}
.pc{box-shadow:var(--sh-1)}.pc:hover{box-shadow:var(--sh-3);transform:translateY(-4px)}
.wel{border-radius:var(--r-lg);box-shadow:var(--sh-3)}
.box{border-radius:var(--r-lg);box-shadow:var(--sh-3)}
.btn{border-radius:10px;font-weight:600;letter-spacing:.01em;box-shadow:0 1px 2px rgba(13,59,102,.08)}
.btn.g{background:linear-gradient(180deg,#22ab5f,var(--green))}
.btn.b,.btn{background:linear-gradient(180deg,#3376de,var(--navy))}
.btn.r{background:linear-gradient(180deg,#ea5d61,var(--red))}
.btn:hover:not(:disabled){box-shadow:0 6px 16px rgba(13,59,102,.22);filter:brightness(1.04)}
.tl{box-shadow:var(--sh-2)}
.bd{border-radius:99px;font-weight:700;letter-spacing:.02em}
.gb{border-radius:var(--r-lg);box-shadow:0 12px 30px rgba(13,59,102,.28)}
input,select,textarea{border-radius:9px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,108,212,.15);outline:none}
.side{box-shadow:2px 0 18px rgba(0,0,0,.18)}
.side a{border-radius:9px;transition:background .15s,transform .15s}
.side a:hover{transform:translateX(3px)}
.side a.on{box-shadow:0 2px 10px rgba(43,108,212,.4)}
.top{box-shadow:0 2px 10px rgba(13,59,102,.06)}
.av{box-shadow:0 2px 6px rgba(43,108,212,.4)}
.hin h1{font-family:'Fraunces',serif;letter-spacing:0}
.wel .im .ov2{border-radius:var(--r-md);backdrop-filter:blur(2px)}
.cert,.lc,.ag{border-radius:var(--r-lg)}
::selection{background:rgba(43,108,212,.25)}
.lg button{transition:background .15s}
.chp button{border-radius:99px;transition:.15s}
.chp button.on{box-shadow:0 2px 8px rgba(13,59,102,.3)}
@media(min-width:801px){main{padding:26px 30px}}
[data-theme=dark] .card{box-shadow:0 1px 2px rgba(0,0,0,.3)}
[data-theme=dark] .card:hover{box-shadow:0 6px 20px rgba(0,0,0,.45)}
[data-theme=dark] .pc:hover{box-shadow:0 16px 40px rgba(0,0,0,.5)}

const hrM=()=>{try{return(+new Date().toLocaleString("en-GB",{timeZone:"Indian/Comoro",hour:"2-digit",hour12:false}))%24}catch(e){return new Date().getHours()}};
function greet(){const h=hrM();return h>=5&&h<12?["🌅","Bonjour"]:h>=12&&h<17?["☀️","Bon après-midi"]:h>=17&&h<21?["🌇","Bonsoir"]:h>=21?["🌙","Bonne soirée"]:["🌌","Bonne nuit"]}

function tick(){const d=new Date(),Lc={fr:"fr-FR",en:"en-GB",ar:"ar-u-nu-latn"}[S.lang];let s;try{s=d.toLocaleString(Lc,{timeZone:"Indian/Comoro",weekday:"long",day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}catch(e){s=d.toLocaleString()}document.querySelectorAll(".clk").forEach(e=>e.textContent="🕒 "+s+" · Moroni");const sc=SBC();document.querySelectorAll(".syn").forEach(e=>{e.textContent=sc.url?(SYN.ok?"☁️ "+t("Synchronisé"):"⚠ "+t("Hors ligne")):"💾 "+t("Local");e.title=SYN.m||""});

function tw(id){S.hid=S.hid.includes(id)?S.hid.filter(x=>x!=id):S.hid.concat(id);try{localStorage.setItem("ctlrs_hid",JSON.stringify(S.hid))}catch(e){}render()}
const wpanel=()=>`<div class="card"><div class="fl2"><b>👁 ${t("Widgets affichés")}</b><div class="chp">${WL.map(([k,l])=>`<button class="${S.hid.includes(k)?"":"on"}" onclick="tw('${k}')">${S.hid.includes(k)?"🙈":"👁"} ${t(l)}</button>`).join("")}</div></div></div>`;
function badge(r,v){const A=DB.apps.filter(a=>!a.ghost);let n=0;if(v=="q"){if(r=="off")n=A.filter(a=>a.stage==0&&!a.ret).length;if(r=="insp")n=A.filter(a=>a.stage==2&&(!a.asg||a.asg==S.user.id)).length;if(r=="dir")n=A.filter(a=>a.stage==3||a.stage==5).length}if(v=="fin")n=DB.inv.filter(i=>i.st=="REVIEW").length;if(r=="op"&&v=="msg")n=DB.notes.filter(x=>x.u==S.user.id).length;if(r=="op"&&v=="inv")n=myInv(S.user.id).filter(i=>["UNPAID","REJECTED"].includes(i.st)).length;return n||""}
function exportDB(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:"application/json"}));a.download="ctlrs_backup_"+DB.today+".json";a.click();L("Exporter la sauvegarde")}
function importDB(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.set||!o.lic||!o.apps)throw 0;DB=o;save();L("Importer une sauvegarde");flash("Paramètres enregistrés.")}catch(e){flashE("Fichier invalide.")}};r.readAsText(f)}
const CFG=window.CTLRS_CONFIG||{};
const ROOM=(()=>{try{return new URLSearchParams(location.search).get("room")||CFG.ROOM||"main"}catch(e){return CFG.ROOM||"main"}})();
const SBC=()=>{if(CFG.SUPABASE_URL)return{url:CFG.SUPABASE_URL,key:CFG.SUPABASE_ANON_KEY,tb:"app_state",id:ROOM,fixed:1};try{return JSON.parse(localStorage.getItem("ctlrs_sbcfg"))||{}}catch(e){return{}}};
const clone=o=>JSON.parse(JSON.stringify(o));
let BASE=null,RV=-1,DIRTY=false,BUSY=false,SYN={ok:null},sbT;
const setSyn=(ok,m)=>{SYN={ok,m}};
async function sbReq(m,q,body,pref){const c=SBC();if(!c.url||!c.key)throw new Error("config");const r=await fetch(c.url.replace(/\/$/,"")+"/rest/v1/"+(c.tb||"app_state")+q,{method:m,headers:{apikey:c.key,Authorization:"Bearer "+c.key,"Content-Type":"application/json",Prefer:pref||"return=minimal"},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,120));const tx=await r.text();return tx?JSON.parse(tx):null}
const rowQ=()=>"?id=eq."+encodeURIComponent(SBC().id||"main");
function merge(b,l,r){const o=clone(r),same=(x,y)=>JSON.stringify(x)==JSON.stringify(y);
 for(const[k,kf]of[["apps","id"],["inv","no"],["lic","no"]]){const bm=new Map((b[k]||[]).map(x=>[x[kf],x])),lm=new Map((l[k]||[]).map(x=>[x[kf],x]));let arr=o[k]||[];
  for(const[id,x]of lm){const bx=bm.get(id);if(!bx||!same(bx,x)){const i=arr.findIndex(y=>y[kf]==id);if(i>=0)arr[i]=x;else arr.unshift(x)}}
  for(const id of bm.keys())if(!lm.has(id))arr=arr.filter(y=>y[kf]!=id);o[k]=arr}
 o.users=o.users||{};for(const k of Object.keys(l.users)){if(!b.users||!b.users[k]||!same(b.users[k],l.users[k]))o.users[k]=l.users[k]}for(const k of Object.keys(b.users||{}))if(!l.users[k])delete o.users[k];
 for(const k of["log","notes","mail","ann"]){const bs=new Set((b[k]||[]).map(x=>JSON.stringify(x))),has=new Set((o[k]||[]).map(x=>JSON.stringify(x))),add=(l[k]||[]).filter(x=>!bs.has(JSON.stringify(x))&&!has.has(JSON.stringify(x)));o[k]=add.concat(o[k]||[]).slice(0,600)}
 for(const k of["set","docs","acts","acc","isl","today"])if(!same(b[k],l[k]))o[k]=l[k];o.seq=Math.max(l.seq||0,r.seq||0);return o}
function adopt(row){DB=row.data;RV=row.version;BASE=clone(DB);try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}}
async function sbInit(){const c=SBC();if(!c.url)return;try{let r=await sbReq("GET",rowQ()+"&select=data,version");if(!r.length){await sbReq("POST","?on_conflict=id",{id:c.id,data:DB,version:1},"resolution=ignore-duplicates,return=minimal");r=await sbReq("GET",rowQ()+"&select=data,version")}adopt(r[0]);setSyn(true)}catch(e){setSyn(false,e.message)}render()}
async function sbPush(silent){const c=SBC();if(!c.url||!BASE)return;if(BUSY){DIRTY=true;return}BUSY=true;try{let ok=false;for(let n=0;n<4&&!ok;n++){const r=(await sbReq("GET",rowQ()+"&select=data,version"))[0],merged=r?merge(BASE,DB,r.data):DB,v=r?r.version:0,res=r?await sbReq("PATCH",rowQ()+"&version=eq."+v,{data:merged,version:v+1,updated_at:new Date().toISOString()},"return=representation"):await sbReq("POST","?on_conflict=id",{id:c.id,data:merged,version:1},"return=representation");
  if(res&&res.length){const ch=JSON.stringify(merged)!=JSON.stringify(DB);DB=merged;BASE=clone(merged);RV=v+1;ok=true;try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}if(ch)softRender()}}
 setSyn(ok);if(!silent&&ok)flash("Synchronisation réussie.")}catch(e){setSyn(false,e.message);if(!silent)flashE("Échec : {0}",e.message)}BUSY=false;if(DIRTY){DIRTY=false;sbAuto()}}
async function sbPull(){try{const f=(await sbReq("GET",rowQ()+"&select=data,version"))[0];if(!f)throw new Error("empty");adopt(f);setSyn(true);flash("Données récupérées.")}catch(e){flashE("Échec : {0}",e.message)}}
function sbAuto(){const c=SBC();if(!c.url)return;DIRTY=false;clearTimeout(sbT);sbT=setTimeout(()=>sbPush(1),800)}
async function sbPoll(){const c=SBC();if(!c.url||!BASE||BUSY||sbT)return;try{const r=await sbReq("GET",rowQ()+"&select=version");if(r.length&&r[0].version!=RV){const f=(await sbReq("GET",rowQ()+"&select=data,version"))[0];adopt(f);softRender()}setSyn(true)}catch(e){setSyn(false,e.message)}}
function softRender(){const a=document.activeElement,busy=S.user&&((a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!="sq"&&a.type!="checkbox")||document.querySelector("#modal .ov")||S.view=="new"||document.querySelector(".ifm"));if(busy){let u=document.getElementById("upd");if(!u){u=document.createElement("div");u.id="upd";u.className="upd";document.body.appendChild(u)}u.innerHTML=`🔄 ${t("Nouvelles données disponibles")} <button onclick="this.parentNode.remove();render()">${t("Actualiser")}</button>`}else render()}
async function resetAll(){if(!confirm(t("Réinitialiser les données de démonstration pour tous les utilisateurs ?")))return;try{localStorage.removeItem(LS)}catch(e){}DB=seedAll();const c=SBC();if(c.url){try{await sbReq("POST","?on_conflict=id",{id:c.id,data:DB,version:(RV>0?RV:0)+1},"resolution=merge-duplicates,return=minimal");const f=(await sbReq("GET",rowQ()+"&select=data,version"))[0];adopt(f)}catch(e){}}else save();render()}
