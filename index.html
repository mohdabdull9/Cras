/* ===== v10 · confirmation dialog: "are you sure?" + comment ===== */
function ask(o,cb){askClose();const e=document.createElement("div");e.id="askm";e.className="askov";
 const msg=o.html||esc(t(o.msg||"Êtes-vous sûr de vouloir effectuer cette action ?",...(o.a||[])));
 e.innerHTML=`<div class="mbx ask" role="alertdialog" aria-modal="true" aria-labelledby="askT" aria-describedby="askD"><h3 id="askT">${o.icon||(o.danger?"⛔":"❓")} ${esc(t(o.title||"Confirmation"))}</h3><p id="askD">${msg}</p>${o.extra||""}${o.comment?`<label for="askC">${t(o.comment=="req"?"Commentaire (obligatoire)":"Commentaire (facultatif)")}</label><textarea id="askC" rows="3">${esc(o.def||"")}</textarea><small class="askerr" id="askE"></small>`:`<small class="askerr" id="askE"></small>`}<p class="asq">${t("Êtes-vous sûr ?")}</p><div class="askb"><button class="btn o" id="askNo">${t("Annuler")}</button><button class="btn ${o.danger?"r":"g"}" id="askOk">${esc(t(o.ok||"Oui, confirmer"))}</button></div></div>`;
 document.body.appendChild(e);const ta=e.querySelector("#askC"),er=e.querySelector("#askE");
 e.querySelector("#askNo").onclick=()=>{askClose();if(o.no)o.no()};
 e.querySelector("#askOk").onclick=()=>{const c=ta?ta.value.trim():"";if(o.comment=="req"&&c.length<3){er.textContent=t("Un commentaire est obligatoire.");ta.focus();return}let ex=null;if(o.read){ex=o.read();if(typeof ex=="string"&&ex.startsWith("!")){er.textContent=ex.slice(1);return}}askClose();cb(c,ex)};
 setTimeout(()=>{const f=e.querySelector("input,textarea")||e.querySelector("#askOk");if(f)f.focus()},20)}
const askClose=()=>{const e=document.getElementById("askm");if(e)e.remove()};
const cmt=c=>c?" – "+c:"";

const pwOK=p=>{const s=SEC();return p.length>=s.pwMin&&/[A-Za-z]/.test(p)&&/\d/.test(p)};
const pwMsg=()=>t("Le mot de passe doit contenir au moins {0} caractères, une lettre et un chiffre.",SEC().pwMin);
const isAdm=u=>u&&(u.role=="exe"||u.role=="sa");
const canManage=(id)=>{const u=DB.users[id],me=S.user;if(!u||!me||id==me.id)return false;if(me.role=="sa")return true;return me.role=="exe"&&!isAdm(u)};

setInterval(()=>{if(S.user&&S.user.role!="op"&&Date.now()-S.act>SEC().idle*60000){L("Session expirée",S.user.email||S.user.id);askClose();CM();S.user=null;S.portal=null;S.msg=["Session expirée après inactivité. Veuillez vous reconnecter.",[]];S.mc="warn";render()}},30000);

function grBanner(){const[g,k]=greet();return`<div class="gb"><div class="gi">${g}</div><div><h2>${t(k)}, ${esc(S.user.name)}</h2><small>${t(RN[S.user.role])} · <span class="clk"></span></small>${k=="Bonne nuit"?`<br><small>${t("Il est tard – pensez à vous reposer.")}</small>`:""}</div></div>`}
function tick(){const d=new Date(),Lc={fr:"fr-FR",en:"en-GB",ar:"ar-u-nu-latn"}[S.lang];let s;try{s=d.toLocaleString(Lc,{timeZone:"Indian/Comoro",weekday:"long",day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false})}catch(e){s=d.toLocaleString()}document.querySelectorAll(".clk").forEach(e=>e.textContent=s+" · Moroni");const sc=SBC();document.querySelectorAll(".syn").forEach(e=>{e.textContent=sc.url?(SYN.ok?"☁️ "+t("Synchronisé"):"⚠ "+t("Hors ligne")):"💾 "+t("Local");e.title=SYN.m||""});
 if(S.user&&Date.now()-S.last>1200000){S.user=null;S.portal=null;S.last=Date.now();alert(t("Session expirée par inactivité."));render()}}
const wd=(id,h)=>S.hid.includes(id)?"":h,WL=[["kpi","Indicateurs"],["money","Recettes"],["ch1","Répartition & recettes"],["ch2","Îles, étapes & SLA"],["live","Activité en direct"]];
function tw(id){S.hid=S.hid.includes(id)?S.hid.filter(x=>x!=id):S.hid.concat(id);try{localStorage.setItem("ctlrs_hid",JSON.stringify(S.hid))}catch(e){}render()}
const wpanel=()=>`<div class="card"><div class="fl2"><b>👁 ${t("Widgets affichés")}</b><div class="chp">${WL.map(([k,l])=>`<button class="${S.hid.includes(k)?"":"on"}" onclick="tw('${k}')">${S.hid.includes(k)?"🙈":"👁"} ${t(l)}</button>`).join("")}</div></div></div>`;
function badge(r,v){const A=DB.apps.filter(a=>!a.ghost);let n=0;if(v=="q"){if(r=="off")n=A.filter(a=>a.stage==0&&!a.ret).length;if(r=="insp")n=A.filter(a=>a.stage==2&&(!a.asg||a.asg==S.user.id)).length;if(r=="dir")n=A.filter(a=>a.stage==3||a.stage==5).length}if(v=="fin")n=DB.inv.filter(i=>i.st=="REVIEW").length;if(r=="sa"&&v=="ctl")n=Object.values(DB.users).filter(u=>u.pend).length+(DB.set.bankP?1:0);if(r=="exe"&&v=="staff")n=Object.values(DB.users).filter(u=>u.pend).length;if(r=="op"&&v=="msg")n=DB.notes.filter(x=>x.u==S.user.id).length;if(r=="op"&&v=="inv")n=myInv(S.user.id).filter(i=>["UNPAID","REJECTED"].includes(i.st)).length;return n||""}
function exportDB(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:"application/json"}));a.download="ctlrs_backup_"+DB.today+".json";a.click();L("Exporter la sauvegarde")}
function importDB(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.set||!o.lic||!o.apps)throw 0;DB=o;save();L("Importer une sauvegarde");flash("Paramètres enregistrés.")}catch(e){flashE("Fichier invalide.")}};r.readAsText(f)}
const CFG=window.CTLRS_CONFIG||{};
const ROOM=(()=>{try{return new URLSearchParams(location.search).get("room")||CFG.ROOM||"main"}catch(e){return CFG.ROOM||"main"}})();
const SBC=()=>{if(CFG.SUPABASE_URL)return{url:CFG.SUPABASE_URL,key:CFG.SUPABASE_ANON_KEY,tb:"app_state",id:ROOM,fixed:1};try{return JSON.parse(localStorage.getItem("ctlrs_sbcfg"))||{}}catch(e){return{}}};
const clone=o=>JSON.parse(JSON.stringify(o));
let BASE=null,RV=-1,DIRTY=false,BUSY=false,SYN={ok:null},sbT;
const setSyn=(ok,m)=>{SYN={ok,m}};
async function sbReq(m,q,body,pref){const c=SBC();if(!c.url||!c.key)throw new Error("config");const r=await fetch(c.url.replace(/\/$/,"")+"/rest/v1/"+(c.tb||"app_state")+q,{method:m,headers:{apikey:c.key,Authorization:"Bearer "+c.key,"Content-Type":"application/json",Prefer:pref||"return=minimal"},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,120));const tx=await r.text();return tx?JSON.parse(tx):null}
const rowQ=()=>"?id=eq."+encodeURIComponent(SBC().id||"main");
function merge(b,l,r){const o=clone(r),same=(x,y)=>JSON.stringify(x)==JSON.stringify(y);
 for(const[k,kf]of[["apps","id"],["inv","no"],["lic","no"]]){const bm=new Map((b[k]||[]).map(x=>[x[kf],x])),lm=new Map((l[k]||[]).map(x=>[x[kf],x]));let arr=o[k]||[];
  for(const[id,x]of lm){const bx=bm.get(id);if(!bx||!same(bx,x)){const i=arr.findIndex(y=>y[kf]==id);if(i>=0)arr[i]=x;else arr.unshift(x)}}
  for(const id of bm.keys())if(!lm.has(id))arr=arr.filter(y=>y[kf]!=id);o[k]=arr}
 o.users=o.users||{};for(const k of Object.keys(l.users)){if(!b.users||!b.users[k]||!same(b.users[k],l.users[k]))o.users[k]=l.users[k]}for(const k of Object.keys(b.users||{}))if(!l.users[k])delete o.users[k];
 for(const k of["log","notes","mail","ann","rpts"]){const bs=new Set((b[k]||[]).map(x=>JSON.stringify(x))),has=new Set((o[k]||[]).map(x=>JSON.stringify(x))),add=(l[k]||[]).filter(x=>!bs.has(JSON.stringify(x))&&!has.has(JSON.stringify(x)));o[k]=add.concat(o[k]||[]).slice(0,600)}
 for(const k of["set","docs","acts","acc","isl","today"])if(!same(b[k],l[k]))o[k]=clone(l[k]);o.seq=Math.max(l.seq||0,r.seq||0);return o}
function adopt(row){DB=migrate(row.data);RV=row.version;BASE=clone(DB);cacheLS()}
async function sbInit(){const c=SBC();if(!c.url)return;try{let r=await sbReq("GET",rowQ()+"&select=data,version");if(!r.length){await sbReq("POST","?on_conflict=id",{id:c.id,data:DB,version:1},"resolution=ignore-duplicates,return=minimal");r=await sbReq("GET",rowQ()+"&select=data,version")}adopt(r[0]);setSyn(true)}catch(e){setSyn(false,e.message)}render()}
async function sbPush(silent){const c=SBC();if(!c.url||!BASE)return;if(BUSY){DIRTY=true;return}BUSY=true;try{let ok=false;for(let n=0;n<4&&!ok;n++){const r=(await sbReq("GET",rowQ()+"&select=data,version"))[0],snap=clone(DB),merged=r?merge(BASE,snap,r.data):snap,v=r?r.version:0,res=r?await sbReq("PATCH",rowQ()+"&version=eq."+v,{data:merged,version:v+1,updated_at:new Date().toISOString()},"return=representation"):await sbReq("POST","?on_conflict=id",{id:c.id,data:merged,version:1},"return=representation");
  if(res&&res.length){let nd=merged;if(JSON.stringify(DB)!=JSON.stringify(snap)){nd=merge(snap,DB,clone(merged));DIRTY=true}const ch=JSON.stringify(nd)!=JSON.stringify(DB);DB=nd;BASE=clone(merged);RV=v+1;ok=true;cacheLS();if(ch)softRender()}}
 setSyn(ok);if(!silent&&ok)flash("Synchronisation réussie.")}catch(e){setSyn(false,e.message);if(!silent)flashE("Échec : {0}",e.message)}BUSY=false;if(DIRTY){DIRTY=false;sbAuto()}}
async function sbPull(){try{const f=(await sbReq("GET",rowQ()+"&select=data,version"))[0];if(!f)throw new Error("empty");adopt(f);setSyn(true);flash("Données récupérées.")}catch(e){flashE("Échec : {0}",e.message)}}
function sbAuto(){const c=SBC();if(!c.url)return;DIRTY=false;clearTimeout(sbT);sbT=setTimeout(()=>{sbT=null;sbPush(1)},800)}
async function sbPoll(){const c=SBC();if(!c.url||!BASE||BUSY||sbT||DIRTY)return;try{const r=await sbReq("GET",rowQ()+"&select=version");if(r.length&&r[0].version!=RV){const f=(await sbReq("GET",rowQ()+"&select=data,version"))[0];adopt(f);softRender()}setSyn(true)}catch(e){setSyn(false,e.message)}}
function softRender(){const a=document.activeElement,busy=S.user&&((a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!="sq"&&a.type!="checkbox")||document.querySelector("#modal .ov")||S.view=="new"||document.querySelector(".ifm"));if(busy){let u=document.getElementById("upd");if(!u){u=document.createElement("div");u.id="upd";u.className="upd";document.body.appendChild(u)}u.innerHTML=`🔄 ${t("Nouvelles données disponibles")} <button onclick="this.parentNode.remove();render()">${t("Actualiser")}</button>`}else render()}
async function resetAll(){if(!confirm(t("Réinitialiser les données de démonstration pour tous les utilisateurs ?")))return;try{localStorage.removeItem(LS)}catch(e){}DB=seedAll();const c=SBC();if(c.url){try{await sbReq("POST","?on_conflict=id",{id:c.id,data:DB,version:(RV>0?RV:0)+1},"resolution=merge-duplicates,return=minimal");const f=(await sbReq("GET",rowQ()+"&select=data,version"))[0];adopt(f)}catch(e){}}else save();render()}
const bkTab=()=>`<div class="card"><h3>💾 ${t("Sauvegarde & restauration")}</h3><p class="mu">${t("Exportez toutes les données (JSON) ou restaurez une sauvegarde.")}</p><button class="btn g" onclick="exportDB()">⬇ ${t("Exporter la sauvegarde")}</button> <label class="btn b">⬆ ${t("Importer une sauvegarde")}<input type="file" accept=".json" hidden onchange="importDB(this)"></label> <button class="btn r" onclick="resetAll()">${t("Réinitialiser la démo")}</button></div>`;
const syTab=()=>{const c=SBC();return`<div class="al bad">⚠ ${t("Prototype : les mots de passe sont stockés en clair dans les données. N'utilisez pas la synchronisation avec des données réelles avant la migration vers Supabase Auth.")}</div>${c.fixed?`<div class="al ok">☁️ ${t("Mode démo partagé actif (salle : {0}).",esc(c.id))} <span class="syn"></span></div><p class="mu">${t("Toute personne ouvrant ce lien voit les mêmes données. Ajoutez ?room=nom au lien pour une salle séparée.")}</p>`:`<div class="card"><h3>☁️ Supabase</h3><div class="row"><div><label>Project URL</label><input id="sb_url" value="${esc(c.url||"")}" placeholder="https://xxxx.supabase.co"></div><div><label>anon public key</label><input id="sb_key" value="${esc(c.key||"")}"></div><div><label>${t("Table")}</label><input id="sb_tb" value="${esc(c.tb||"app_state")}"></div><div><label>${t("Identifiant")}</label><input id="sb_id" value="${esc(c.id||"main")}"></div></div><p><button class="btn g" onclick="sbSave()">${t("Enregistrer")}</button></p></div>`}<p><button class="btn b" onclick="sbPush()">⬆ ${t("Envoyer vers Supabase")}</button> <button class="btn o" onclick="sbPull()">⬇ ${t("Récupérer depuis Supabase")}</button></p>`};
function sbSave(){const c={url:gv("sb_url"),key:gv("sb_key"),tb:gv("sb_tb")||"app_state",id:gv("sb_id")||"main"};try{localStorage.setItem("ctlrs_sbcfg",JSON.stringify(c))}catch(e){}flash("Paramètres enregistrés.");sbInit()}
const _R=render;render=function(){applyTheme();_R();tick()};
["click","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,()=>S.last=Date.now()));
document.addEventListener("keydown",e=>{if(e.key=="Escape"){if(document.getElementById("askm"))askClose();else CM()}if((e.key=="Enter"||e.key==" ")&&e.target&&e.target.matches&&e.target.matches("[tabindex][onclick]:not(button):not(input):not(select):not(textarea)")){e.preventDefault();e.target.click()}});
setInterval(tick,1000);setInterval(sbPoll,3000);
S.vq=(()=>{try{return(new URLSearchParams(location.search).get("v")||"").trim().toUpperCase()}catch(e){return""}})();if(S.vq)S.portal="pub";
render();sbInit();

</script></body></html>
